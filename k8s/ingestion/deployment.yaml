apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  labels:
    app: ingestion-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: ingestion-service:u5-T01
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3200
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ingestion-service-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-key
                  key: api-key
                  optional: true
            - name: THUMBNAIL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: thumbnail-signing-key
                  key: signing-key
          readinessProbe:
            httpGet:
              path: /health
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: blobs-volume
              mountPath: /app/data/blobs
              subPath: blobs
            - name: blobs-volume
              mountPath: /app/data/db
              subPath: db
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '500m'
      volumes:
        - name: blobs-volume
          persistentVolumeClaim:
            claimName: ingestion-blobs

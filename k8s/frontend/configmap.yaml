apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  labels:
    app: frontend
data:
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Limite de tamano en el borde (el limite de multer en ingestion es la otra mitad).
      client_max_body_size 1m;

      # No exponer la version de nginx.
      server_tokens off;

      # Salud para la readinessProbe.
      location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
      }

      # --- API: un unico origen; nginx enruta por prefijo a cada servicio (ClusterIP DNS) ---
      location /api/uploads {
        client_max_body_size 11m; # 10 MB de imagen + sobrecarga multipart
        proxy_pass http://ingestion-service:3200;
        include /etc/nginx/conf.d/proxy-common.inc;
      }
      location /api/auth {
        proxy_pass http://identity-service:3100;
        include /etc/nginx/conf.d/proxy-common.inc;
      }
      location /api/users {
        proxy_pass http://identity-service:3100;
        include /etc/nginx/conf.d/proxy-common.inc;
      }
      location /api/trends {
        proxy_pass http://progress-service:3400;
        include /etc/nginx/conf.d/proxy-common.inc;
      }
      location /api/onboarding {
        proxy_pass http://trust-service:3300;
        include /etc/nginx/conf.d/proxy-common.inc;
      }
      location /api/policy {
        proxy_pass http://trust-service:3300;
        include /etc/nginx/conf.d/proxy-common.inc;
      }
      location /api/history {
        proxy_pass http://trust-service:3300;
        include /etc/nginx/conf.d/proxy-common.inc;
      }

      # Cualquier otra ruta /api/ es un 404 JSON, nunca el index.html de la SPA.
      location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
        return 404 '{"data":null,"error":"Not found","status":404}';
      }

      # Assets con hash de Vite: cacheables.
      location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
      }

      # SPA: cualquier ruta del cliente devuelve index.html (la recarga de /login funciona).
      location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
      }
    }
  # Cabeceras comunes de los proxys. proxy_redirect off: nginx no reescribe ni sigue
  # redirecciones de los upstreams. /api/ nunca se cachea.
  proxy-common.inc: |
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/security-headers.inc;
  # Cabeceras de seguridad. add_header en un location anula las del server, por eso
  # se incluye este archivo en cada location. Sin unsafe-eval ni origenes externos;
  # style-src 'self' basta: Tailwind se compila a un .css y React aplica estilos por CSSOM.
  security-headers.inc: |
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

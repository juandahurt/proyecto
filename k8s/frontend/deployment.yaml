apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: frontend:u0-T06
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/proxy-common.inc
              subPath: proxy-common.inc
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/security-headers.inc
              subPath: security-headers.inc
              readOnly: true
          resources:
            requests:
              memory: '32Mi'
              cpu: '25m'
            limits:
              memory: '128Mi'
              cpu: '250m'
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
